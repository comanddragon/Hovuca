version: "1.0"

# The CI workflow selects qodana-js explicitly. Keep this profile here so the
# same inspection set is used when Qodana is run from PyCharm.
profile:
  name: qodana.starter

# Generated files and package installations are not application source.
exclude:
  - name: All
    paths:
      - .next
      - .open-next
      - node_modules
