name: Qodana

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "Backend/**"
      - ".github/workflows/qodana-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "Backend/**"
      - ".github/workflows/qodana-ci.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  frontend:
    name: Frontend Qodana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze frontend
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: -i,frontend,--linter,qodana-js
          pr-mode: false
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          artifact-name: qodana-frontend-report
        env:
          # Per-service tokens are optional. The existing shared token remains
          # supported while separate Qodana Cloud projects are being set up.
          QODANA_TOKEN: ${{ secrets.QODANA_FRONTEND_TOKEN || secrets.QODANA_TOKEN }}

  backend:
    name: Backend Qodana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze Django backend
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: -i,Backend,--linter,qodana-python-community
          pr-mode: false
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          artifact-name: qodana-backend-report
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_BACKEND_TOKEN || secrets.QODANA_TOKEN }}
