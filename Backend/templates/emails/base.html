<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{% block subject %}HOVUCA{% endblock %}</title>
  <style>
    html, body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    table, td { border-collapse: collapse !important; mso-table-lspace: 0 !important; mso-table-rspace: 0 !important; }
    img { border: 0; display: block; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    a { color: #176345; }
    .preheader { display: none !important; max-height: 0; max-width: 0; opacity: 0; overflow: hidden; mso-hide: all; }
    .button:hover { background-color: #104b34 !important; }
    @media screen and (max-width: 640px) {
      .shell { padding: 20px 10px !important; }
      .content { padding: 34px 24px 30px !important; }
      .header { padding: 24px !important; }
      .footer { padding: 24px !important; }
      .headline { font-size: 29px !important; line-height: 35px !important; }
      .button-cell, .button { display: block !important; text-align: center !important; }
      .stack { display: block !important; width: 100% !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#eef3ef; color:#24342d; font-family:Arial, Helvetica, sans-serif;">
  <div class="preheader">{% block preheader %}A message from HOVUCA.{% endblock %}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background-color:#eef3ef;">
    <tr>
      <td class="shell" align="center" style="padding:40px 16px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(20,69,49,.10);">
          <tr>
            <td class="header" style="background-color:#174f38; padding:28px 40px; border-bottom:5px solid #f0b44d;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td valign="middle" style="width:44px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="width:40px; height:40px; border-radius:10px; background-color:#f0b44d; color:#173a2c; font-family:Georgia, 'Times New Roman', serif; font-size:21px; font-weight:bold;">H</td></tr></table>
                  </td>
                  <td valign="middle" style="padding-left:12px; color:#ffffff; font-family:Georgia, 'Times New Roman', serif; font-size:23px; font-weight:bold; letter-spacing:2px;">HOVUCA</td>
                  <td align="right" valign="middle" style="color:#cce0d5; font-size:11px; letter-spacing:1.4px; text-transform:uppercase;">Community in action</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="content" style="padding:44px 40px 38px;">
              {% block body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td class="footer" style="padding:28px 40px; background-color:#f7faf8; border-top:1px solid #dce7e0; text-align:center;">
              <p style="margin:0 0 10px; color:#40564c; font-size:12px; line-height:19px;">{% block footer_reason %}You received this email from HOVUCA.{% endblock %}</p>
              <p style="margin:0 0 12px; font-size:12px; line-height:20px;"><a href="{{ frontend_url|default:'https://hovuca.org' }}" style="color:#176345; font-weight:bold; text-decoration:none;">Visit hovuca.org</a>&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a href="{{ frontend_url|default:'https://hovuca.org' }}/contact" style="color:#176345; text-decoration:none;">Contact us</a></p>
              <p style="margin:0; color:#53665d; font-size:11px; line-height:18px;">&copy; {% now "Y" %} HOVUCA. Hope, opportunity and lasting change.</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
