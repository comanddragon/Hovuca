services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hovuca
      POSTGRES_USER: silkkeith
      POSTGRES_PASSWORD: "85213"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  backend:
    build:
      context: ./Backend
      dockerfile: dev.Dockerfile
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-me
      DB_NAME: hovuca
      DB_USER: silkkeith
      DB_PASSWORD: "85213"
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

volumes:
  pgdata:
